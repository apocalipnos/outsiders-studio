<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Estudio</title>
<link href="/mi/timeline.css" rel="stylesheet">
<script src="/mi/timeline.js"></script>
<!-- los módulos (herramientas/*.js) los carga la página antes de montar la Edición: basta con dejar un archivo nuevo ahí -->
<style>
  :root {
    --bg: #0a0a0a; --card: #0f0f10; --card2: #171717; --b0: #1c1c1e; --b1: #262626; --b2: #404040;
    --t1: #e5e5e5; --t2: #a3a3a3; --t3: #737373;
    --a: #3ce6ac; --ad: rgba(60,230,172,.1); --ag: rgba(60,230,172,.3); --ok: #22c55e; --red: #ef4444;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--t1); font: 12px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--b1); background: var(--card2); color: var(--t1); padding: 5px 10px; font-weight: 500; font-size: 11px; }
  button:hover { border-color: var(--b2); }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--ad); border-color: var(--a); color: var(--a); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--b1); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .topbar { position: fixed; left: 0; right: 0; top: 0; height: 41px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px 0 12px; background: var(--bg); z-index: 20; }
  .tb-l, .tb-r { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .tb-r { justify-content: flex-end; }
  .logo { font-size: 13px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .logo span { color: var(--a); }
  .tb-sep { width: 1px; height: 16px; background: var(--b1); margin: 0 6px; }
  .pname { color: var(--t2); font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: flex; gap: 2px; background: var(--card2); padding: 3px; border-radius: 6px; }
  .seg button { border: 0; background: none; color: var(--t2); padding: 4px 12px; border-radius: 4px; }
  .seg button:hover { color: var(--t1); }
  .seg button.act { background: var(--t1); color: #171717; }
  .seg button b { font-weight: 500; color: var(--t3); margin-left: 3px; }
  .tb-b { width: 28px; height: 28px; padding: 0; display: grid; place-items: center; border: 0; background: none; color: var(--t2); }
  .tb-b:hover:not(:disabled) { background: rgba(255,255,255,.06); color: #fff; }
  .tb-t { height: 28px; border: 0; background: none; color: var(--t2); display: inline-flex; gap: 5px; align-items: center; }
  .tb-t:hover { color: #fff; background: rgba(255,255,255,.06); }
  .tb-ins { height: 28px; background: var(--ad); border: 1px solid var(--ag); color: var(--a); }
  .tb-ins.off { background: none; border-color: var(--b1); color: var(--t2); }
  .pri { height: 28px; background: var(--a); border: 0; color: #09090b; font-weight: 600; padding: 0 12px; }
  .pri:hover:not(:disabled) { filter: brightness(1.1); }
  .status { position: fixed; left: 0; right: 0; bottom: 0; height: 24px; line-height: 24px; padding: 0 12px; font-size: 10.5px; color: var(--t3); background: var(--bg); z-index: 20; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status b { color: var(--t2); font-weight: 500; }
  /* catálogo a pantalla completa (sin proyecto) */
  .page { position: fixed; left: 4px; right: 4px; top: 41px; bottom: 24px; overflow: auto; background: var(--card); border: 1px solid var(--b0); border-radius: 10px; padding: 14px 18px 30px; }
  .sub { color: var(--t3); font-size: 11px; margin-bottom: 10px; }
  .note { margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; background: var(--ad); border: 1px solid var(--ag); font-size: 11px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .st-lbody .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .card { position: relative; background: var(--card2); border: 1px solid var(--b0); border-radius: 8px; overflow: hidden; cursor: pointer; transition: border-color .12s; }
  .card:hover { border-color: var(--b2); }
  .card.sel { border-color: var(--a); box-shadow: 0 0 0 1px var(--a); }
  .card.out { opacity: .38; }
  .card.out:hover { opacity: .7; }
  .media { aspect-ratio: 9/16; background: #000; position: relative; }
  .st-lbody .media { aspect-ratio: 4/5; }
  .media video, .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media .plain { position: absolute; inset: 0; display: grid; place-items: center; color: var(--t3); font-size: 11px; padding: 14px; text-align: center; }
  .info { padding: 7px 8px 8px; }
  .name { font-weight: 600; font-size: 11px; }
  .line { color: var(--t3); font-size: 10.5px; margin-top: 2px; line-height: 1.35; }
  .lab { color: var(--t3); font-size: 10px; margin-top: 4px; }
  .chip { position: absolute; top: 6px; left: 6px; z-index: 2; font-size: 9.5px; font-weight: 600; padding: 2px 6px; border-radius: 99px; background: rgba(0,0,0,.65); color: var(--t1); }
  .chip.yes { background: var(--a); color: #09090b; }
  .chip.sel { background: var(--a); color: #09090b; left: auto; right: 6px; }
  .chip.st-receta { background: #f59e0b; color: #111; }
  .chip.st-validado { background: #3b82f6; }
  .chip.st-programado { background: #22c55e; color: #111; }
  .chip.soon { color: var(--t2); }
  .fdet { margin-top: 14px; background: var(--card2); border: 1px solid var(--b0); border-radius: 8px; padding: 12px 14px; }
  .fdet .fst { color: var(--t3); font-weight: 500; font-size: 11px; }
  .fdet h3 { margin: 0 0 8px; font-size: 13px; }
  .fdet .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .st-lbody .fdet .cols { grid-template-columns: 1fr; }
  .fdet h4 { margin: 0 0 4px; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--t3); }
  .fdet ul, .fdet ol { margin: 0; padding-left: 16px; color: var(--t2); font-size: 11px; line-height: 1.55; }
  .empty { margin-top: 20px; text-align: center; color: var(--t3); padding: 36px 14px; border: 1px dashed var(--b1); border-radius: 10px; }
  .fi { display: grid; grid-template-columns: minmax(180px, 280px) 1fr; gap: 18px; align-items: start; max-width: 960px; }
  .fi video { width: 100%; border-radius: 8px; background: #000; display: block; }
  .fi h3 { margin: 0 0 8px; font-size: 13px; }
  .fi table { border-collapse: collapse; margin-bottom: 12px; font-size: 12px; }
  .fi td { padding: 4px 18px 4px 0; border-top: 1px solid var(--b0); color: var(--t1); }
  .fi td:first-child { color: var(--t2); }
  .fi .col { display: flex; gap: 5px; margin-bottom: 12px; }
  .fi .col i { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--b1); }
  .fi p { margin: 0 0 7px; color: var(--t2); font-size: 12px; line-height: 1.5; }
  .fi p b { color: var(--t1); font-weight: 600; }
  .fi textarea { width: 100%; min-height: 70px; padding: 8px 10px; font: inherit; font-size: 12px; color: var(--t1); background: var(--card2); border: 1px solid var(--b1); border-radius: 8px; margin-top: 6px; }
  .fi textarea:focus { outline: 0; border-color: var(--a); }
  @media (max-width: 700px) { .fi { grid-template-columns: 1fr; } }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .chips button { padding: 3px 8px; border-radius: 99px; border: 0; background: var(--card2); color: var(--t2); font-size: 10.5px; }
  .chips button.act { background: var(--t1); color: #171717; }
  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--t1); color: var(--bg); font-weight: 600; padding: 8px 14px; border-radius: 8px; transition: .2s; z-index: 99; pointer-events: none; font-size: 12px; max-width: 80vw; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .toast.err { background: var(--red); color: #fff; }
  .shot { position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,.8); display: grid; place-items: center; }
  .shot img { max-height: 88vh; max-width: 90vw; border-radius: 8px; }
  .shot .acts { position: absolute; right: 16px; top: 12px; display: flex; gap: 6px; }
  @media (max-width: 700px) { .pname, .tb-t span { display: none; } .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-l">
    <div class="logo">Mi <span>Estudio</span></div><i class="tb-sep"></i><div class="pname" id="pname"></div>
    <button class="tb-b" id="sideBtn" title="Ocultar o mostrar la barra lateral" hidden><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.700"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
  </div>
  <div class="seg" id="tabs"></div>
  <div class="tb-r">
    <button class="tb-b" id="undoBtn" title="Deshacer (Ctrl+Z)" hidden disabled><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 010 10"/></svg></button>
    <button class="tb-b" id="redoBtn" title="Rehacer (Ctrl+Mayús+Z)" hidden disabled><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 000 10"/></svg></button>
    <button class="tb-t" id="shotBtn" title="Ver este momento tal como saldrá en el vídeo final" hidden><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.700"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.500"/></svg><span>Ver resultado</span></button>
    <button class="tb-ins" id="insBtn" title="Ocultar o mostrar el panel derecho" hidden>Panel</button>
    <button id="editBtn"></button>
    <button class="pri" id="saveBtn">Guardar</button>
  </div>
</header>
<main class="page" id="page">
  <div class="sub" id="modeSub"></div>
  <div id="note"></div>
  <div id="grid" class="grid"></div>
  <div id="fdetail"></div>
</main>
<div id="tl" hidden></div>
<footer class="status" id="sum"></footer>
<div class="toast" id="toast"></div>

<script>
(function () {
  var TABS = [['formatos', 'Formatos'], ['styles', 'Estilos'], ['captions', 'Subtítulos'], ['effects', 'Efectos']];
  var NOTA = { tipografia: 'Tipografía', subtitulos: 'Subtítulos', elementos: 'Elementos', estructura: 'Estructura', ritmo: 'Ritmo' };
  var ESTADOS = { receta: 'Receta · sin validar', validado: 'Validado · falta programar', programado: 'Programado ✓' };
  var PREPTABS = [['formatos', '1 · Formato'], ['styles', '2 · Estilo'], ['captions', '3 · Subtítulos'], ['effects', '4 · Efectos']];
  var PREPORDER = PREPTABS.map(function (t) { return t[0]; });
  var S = { cat: null, filtro: { styles: [], captions: [], effects: [] }, tab: 'styles', edit: false, project: null, tlMounted: false, formato: null, prep: false, cattab: 'captions', view: 'edit', catExtra: [],
            sel: { mode: 'custom', style: null, captionStyle: null, effects: [] } };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
  var noop = function () {};

  function api(url, body) {
    var opt = body === undefined ? { cache: 'no-store' }
      : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    return fetch(url, opt).then(function (r) {
      return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || r.status); return d; });
    });
  }

  function toast(msg, err) {
    var t = $('toast');
    t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = 'toast'; }, 2600);
  }
  Timeline.toast = toast;

  function find(list, key) { return S.cat[list].filter(function (x) { return x.key === key; })[0]; }
  function inFiltro(sec, it) { return sec === 'formatos' || it.none || S.filtro[sec].indexOf(it.key) >= 0; }

  function isSel(sec, it) {
    if (sec === 'styles') return S.sel.mode === 'preset' && S.sel.style === it.key;
    if (sec === 'formatos') return S.formato === it.key;
    if (sec === 'captions') return S.sel.captionStyle === it.key;
    return S.sel.effects.indexOf(it.key) >= 0;
  }

  function card(sec, it) {
    var shown = inFiltro(sec, it), sel = (!S.edit || sec === 'formatos') && isSel(sec, it);
    var media = it.preview
      ? '<video muted loop playsinline preload="none" src="' + esc(it.preview) + '"' + (it.poster ? ' poster="' + esc(it.poster) + '"' : '') + '></video>'
      : (it.poster ? '<img src="' + esc(it.poster) + '" alt="">' : '<div class="plain">' + esc(it.none ? 'Sin subtítulos' : 'Sin vista previa') + '</div>');
    var chip = '';
    if (S.edit && !it.none && sec !== 'formatos') chip = shown ? '<span class="chip yes">✓ En mi estudio</span>' : '<span class="chip">+ Añadir</span>';
    if (!S.edit && sec === 'styles' && !it.ready) chip = '<span class="chip soon">Próximamente</span>';
    if (sec === 'formatos') chip = '<span class="chip st-' + esc(it.estado) + '">' + (ESTADOS[it.estado] || esc(it.estado)) + '</span>';
    if (sel) chip += '<span class="chip sel">Elegido</span>';
    var extra = '';
    if (sec === 'styles') {
      var c = it.captionStyle && find('captions', it.captionStyle);
      var capName = it.mine && (it.captionStyle === 'none' || !c) ? (it.capLabel || 'Estilo guardado') : (c ? c.name : '');
      extra = '<div class="lab">' + esc(capName) + (it.effects.length ? ' · ' + it.effects.length + ' efectos' : '') + '</div>';
    } else if (it.label) {
      extra = '<div class="lab">' + esc(it.label) + '</div>';
    }
    return '<div class="card' + (sel ? ' sel' : '') + (S.edit && !shown ? ' out' : '') + '" data-sec="' + sec + '" data-key="' + esc(it.key) + '">' +
      chip + '<div class="media">' + media + '</div>' +
      '<div class="info"><div class="name">' + esc(it.name) + '</div><div class="line">' + esc(it.line) + '</div>' + extra + '</div></div>';
  }

  function names() {
    var n = {};
    S.cat.effects.forEach(function (e) { n[e.key] = e.name; });
    return n;
  }

  function formatoDetail() {
    var f = S.formato && find('formatos', S.formato);
    if (!f) return '';
    return '<div class="fdet"><h3>' + esc(f.name) + ' <span class="fst">· ' + (ESTADOS[f.estado] || '') + '</span></h3><div class="cols"><div><h4>Visual</h4><ul>' +
      f.visual.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div><div><h4>Estructura</h4><ol>' +
      f.estructura.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol></div></div></div>';
  }

  // ---------- el catálogo como panel lateral de la Edición ----------
  function catalogPanel(el) {
    var chips = TABS.concat(S.catExtra.map(function (x) { return [x.id, x.label]; }));
    var head = '<div class="chips">' + chips.map(function (t) {
      return '<button class="' + (t[0] === S.cattab ? 'act' : '') + '" data-cat="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>';
    var ext = S.catExtra.filter(function (x) { return x.id === S.cattab; })[0];
    if (ext) { el.innerHTML = head + '<div id="catExt"></div>'; ext.render(el.querySelector('#catExt')); return; }
    var sec = S.cattab, all = S.cat[sec], items = S.edit ? all : all.filter(function (it) { return inFiltro(sec, it); }), real = items.filter(function (it) { return !it.none; });
    var body;
    if (sec === 'formatos') {
      body = real.length ? '<div class="grid">' + items.map(function (it) { return card(sec, it); }).join('') + '</div>' + formatoDetail()
        : '<div class="empty">Aún no tienes formatos. Pásale a Claude enlaces de reels y dile "guarda el formato X".</div>';
    } else if (!S.edit && !real.length && sec !== 'captions') {
      body = '<div class="empty">Aún no tienes ' + (sec === 'styles' ? 'estilos' : 'efectos') + ' en tu estudio.<br><br><button data-act="edit">Añadir desde el catálogo</button></div>';
    } else {
      body = (S.edit ? '<div class="note">Lo que marques con ✓ es lo único que aparecerá en tu estudio.</div>' : '') + '<div class="grid">' + items.map(function (it) { return card(sec, it); }).join('') + '</div>';
    }
    el.innerHTML = head + (sec === 'formatos' ? '' : '<div style="margin-bottom:8px"><button data-act="edit" class="' + (S.edit ? 'on' : '') + '">' + (S.edit ? 'Listo' : 'Editar mi estudio') + '</button></div>') + body;
  }
  Timeline.addLeft({ id: 'catalogo', label: 'Catálogo', order: 40, tip: 'Formatos, estilos, subtítulos y efectos', render: catalogPanel });
  Timeline.addCatalog = function (x) { S.catExtra.push(x); };   // un apartado más del catálogo (Bloques)

  function mountTimeline() {
    $('page').hidden = true; $('tl').hidden = false; $('editBtn').hidden = true;
    ['sideBtn', 'undoBtn', 'redoBtn', 'shotBtn', 'insBtn'].forEach(function (b) { $(b).hidden = false; });
    $('pname').textContent = S.project.name;
    Timeline.onChange = summary;
    Timeline.onHistory = function (u, r) { $('undoBtn').disabled = !u; $('redoBtn').disabled = !r; };
    Timeline.mount($('tl'), S.project, S.sel.effects, names(), S.edicion);
    S.tlMounted = true;
    if (S.modo && S.modo.resultado && window.MiResultado) setTimeout(function () { MiResultado.toggle(true); }, 0);   // montado: a aprobarlo
    var views = [['edit', 'Edición']].concat(Timeline.views().map(function (v) { return [v.id, v.label]; }));
    $('tabs').innerHTML = views.map(function (t) { return '<button class="' + (t[0] === S.view ? 'act' : '') + '" data-view="' + t[0] + '">' + esc(t[1]) + '</button>'; }).join('');
    if (views.length < 2) $('tabs').hidden = true;
    if (!S.sel.captionStyle) { S.cattab = 'captions'; refreshCatalog(); toast('Elige los subtítulos en Catálogo para poder procesar el vídeo'); }
    summary();
  }
  function refreshCatalog() { var t = Timeline; if (t.showLeftPanel) t.showLeftPanel('catalogo'); var b = document.querySelector('.st-ltabs [data-ltab="catalogo"]'); if (b) b.click(); }

  function render() {
    if (S.project) {
      var box = document.querySelector('.st-lbody'), act = document.querySelector('.st-ltabs .act');
      if (box && act && act.dataset.ltab === 'catalogo') catalogPanel(box);
      Timeline.setEffects(S.sel.effects);
      summary();
      return;
    }
    var sec = S.tab;
    var total = function (s) { return S.cat[s].filter(function (it) { return !it.none && S.filtro[s].indexOf(it.key) >= 0; }).length; };
    $('tabs').innerHTML = (S.prep ? PREPTABS : TABS).map(function (t) {
      var count = t[0] === 'ficha' ? '' : '<b>' + (t[0] === 'formatos' ? S.cat.formatos.length : S.edit ? S.cat[t[0]].filter(function (x) { return !x.none; }).length : total(t[0])) + '</b>';
      return '<button class="' + (t[0] === sec ? 'act' : '') + '" data-tab="' + t[0] + '">' + t[1] + count + '</button>';
    }).join('');
    $('fdetail').innerHTML = ''; $('editBtn').hidden = sec === 'formatos' || sec === 'ficha';
    if (sec === 'ficha') { renderFicha(); summary(); return; }
    var all = S.cat[sec];
    var items = S.edit ? all : all.filter(function (it) { return inFiltro(sec, it); });
    $('editBtn').textContent = S.edit ? 'Listo' : 'Editar mi estudio';
    $('editBtn').className = S.edit ? 'on' : '';
    $('modeSub').textContent = S.edit ? 'Modo edición: toca un elemento para añadirlo o quitarlo de tu estudio'
                                      : 'Elige un estilo, o tus subtítulos y efectos, y pulsa Guardar';
    $('note').innerHTML = S.edit ? '<div class="note">Estás viendo todo el catálogo de video-studio. Lo que marques con ✓ es lo único que aparecerá en tu estudio.</div>' : '';

    var real = items.filter(function (it) { return !it.none; });
    if (sec === 'formatos') {
      $('note').innerHTML = '';
      $('modeSub').textContent = 'Elige el formato del vídeo (visual + estructura), o ninguno';
      $('grid').innerHTML = real.length ? items.map(function (it) { return card(sec, it); }).join('')
        : '<div class="empty" style="grid-column:1/-1">Aún no tienes formatos.<br><br>Pásale a Claude enlaces de reels y dile "guarda el formato X".</div>';
      $('fdetail').innerHTML = formatoDetail();
    } else if (!S.edit && !real.length && sec !== 'captions') {
      $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">Aún no tienes ' + (sec === 'styles' ? 'estilos' : 'efectos') +
        ' en tu estudio.<br><br><button data-act="edit">Añadir desde el catálogo</button></div>';
    } else {
      $('grid').innerHTML = items.map(function (it) { return card(sec, it); }).join('');
    }
    summary();
  }

  // lo que saqué de la referencia, para corregirlo antes de que se corte nada
  function renderFicha() {
    var F = S.ficha, m = F.metricas || {}, n = F.notas || {};
    var filas = [['Duración', m.duracion, ' s'], ['Palabras por segundo', m.palabras_seg, ''], ['Tiempo hablando', m.voz != null ? Math.round(m.voz * 100) : null, ' %']];
    var fm = S.formato && find('formatos', S.formato), st = S.sel.mode === 'preset' && find('styles', S.sel.style);
    $('modeSub').textContent = 'Esto es lo que he sacado de la referencia. Si algo está mal, corrígelo aquí antes de que corte nada.';
    $('note').innerHTML = '';
    $('grid').innerHTML = '<div class="fi" style="grid-column:1/-1"><video src="/mi/ref-video" controls muted playsinline></video><div>' +
      '<h3>' + esc(F.nombre || 'Referencia') + '</h3><table>' + filas.filter(function (f) { return f[1] != null; }).map(function (f) { return '<tr><td>' + f[0] + '</td><td>' + f[1] + f[2] + '</td></tr>'; }).join('') + '</table>' +
      ((F.colores || []).length ? '<div class="col">' + F.colores.map(function (c) { return '<i style="background:' + esc(c) + '" title="' + esc(c) + '"></i>'; }).join('') + '</div>' : '') +
      Object.keys(n).filter(function (k) { return n[k]; }).map(function (k) { return '<p><b>' + esc(NOTA[k] || k) + ':</b> ' + esc(n[k]) + '</p>'; }).join('') +
      ((F.no_igualable || []).length ? '<p><b>No se puede igualar:</b> ' + esc(F.no_igualable.join(' · ')) + '</p>' : '') +
      '<p style="margin-top:12px"><b>Lo que usaré:</b> ' + esc((fm ? 'formato ' + fm.name : 'sin formato') + ' · ' + (st ? 'estilo ' + st.name : 'sin estilo guardado')) + '. Para cambiarlo, usa las pestañas de arriba.</p>' +
      '<label><p style="margin:12px 0 0"><b>¿Algo está mal o quieres otra cosa?</b></p><textarea id="ficharev" placeholder="Por ejemplo: el ritmo es más rápido; los subtítulos van más abajo…">' + esc(S.correccion || '') + '</textarea></label></div></div>';
    $('ficharev').oninput = function () { S.correccion = this.value; };
  }

  function summary() {
    var st = S.sel.mode === 'preset' && find('styles', S.sel.style);
    var cap = S.sel.captionStyle && find('captions', S.sel.captionStyle);
    var fx = S.sel.effects.map(function (k) { var e = find('effects', k); return e ? e.name : k; });
    var fm = S.formato && find('formatos', S.formato);
    $('sum').innerHTML = (fm ? 'Formato: <b>' + esc(fm.name) + '</b> · ' : '') + (st ? 'Estilo: <b>' + esc(st.name) + '</b> · ' : '') +
      'Subtítulos: <b>' + esc(st && st.mine && S.sel.captionStyle === 'none' ? 'los del estilo' : cap ? cap.name : 'sin elegir') + '</b> · ' +
      'Efectos: <b>' + esc(fx.length ? fx.join(', ') : 'ninguno') + '</b>' +
      (S.tlMounted ? ' · Duración: <b>' + Timeline.data().total.toFixed(1) + ' s</b>' +
        (Timeline.dirty().length ? ' · Cambiado: <b>' + Timeline.dirty().join(', ') + '</b>' : '') : '');
    var save = $('saveBtn');
    if (S.project) {
      if (save.textContent === 'Enviado ✓') return;
      var why = S.tlMounted ? razones() : [], direct = S.project.directo && !why.length;
      save.textContent = direct ? 'Exportar vídeo' : 'Procesar vídeo';
      save.disabled = !direct && !cap;
      save.title = direct ? 'No hace falta volver a montar: se exporta aquí mismo, sin esperar a Claude'
        : !cap ? 'Elige antes los subtítulos en Catálogo'
        : 'Hay que volver a montar (' + (why.length ? why.join(', ') : S.project.motivo) + '): se lo manda a Claude';
    } else if (S.prep) {
      save.disabled = S.edit; save.textContent = S.tab === 'effects' || S.tab === 'ficha' ? 'Empezar a editar' : 'Siguiente →';
      if (!S.edit) $('modeSub').textContent = 'Antes de cortar: elige formato, subtítulos y efectos, y pulsa Empezar a editar';
    } else {
      save.disabled = !cap || S.edit; save.textContent = 'Guardar';
    }
  }

  // lo que obliga a pasar por Claude: lo del núcleo más haber cambiado de formato, estilo, subtítulos o efectos
  function razones() {
    var out = Timeline.razones();
    if (JSON.stringify(picksNow()) !== S.picks0 || S.formato !== S.formato0) out.push('formato, estilo o subtítulos');
    return out;
  }
  function picksNow() { return { mode: S.sel.mode, style: S.sel.style, captionStyle: S.sel.captionStyle, effects: S.sel.effects }; }

  function processVideo() {
    if (S.project.directo && !razones().length && window.MiRenders) return MiRenders.exportar();
    var d = Timeline.data();
    var body = { edl: d.edl, effects: d.effects, elementos: d.elementos, formato: S.formato, edicion: d.edicion,
                 picks: { mode: S.sel.mode, style: S.sel.style, captionStyle: S.sel.captionStyle, effects: S.sel.effects, effectSections: null } };
    $('saveBtn').disabled = true;
    api('/api/timeline', body).then(function () {
      Timeline.stop();
      toast('Enviado. Claude está procesando el vídeo; ya puedes cerrar esta pestaña.');
      $('saveBtn').textContent = 'Enviado ✓';
    }).catch(function (e) { toast('No se pudo enviar: ' + e.message, true); $('saveBtn').disabled = false; });
  }

  function toggleFiltro(sec, key) {
    var list = S.filtro[sec], i = list.indexOf(key);
    if (i >= 0) list.splice(i, 1); else list.push(key);
    render();
    api('/api/filtro', S.filtro).catch(function (e) { toast('No se pudo guardar tu estudio: ' + e.message, true); });
  }

  function pick(sec, key) {
    var it = find(sec, key);
    if (sec === 'styles') {
      if (!it.ready) return toast('Este estilo aún no está disponible');
      if (isSel(sec, it)) S.sel = { mode: 'custom', style: null, captionStyle: S.sel.captionStyle, effects: S.sel.effects };
      else S.sel = { mode: 'preset', style: key, captionStyle: it.captionStyle, effects: it.effects.slice() };
    } else if (sec === 'formatos') {
      S.formato = S.formato === key ? null : key;
    } else if (sec === 'captions') {
      S.sel.captionStyle = key;
    } else {
      var i = S.sel.effects.indexOf(key);
      if (i >= 0) S.sel.effects.splice(i, 1); else S.sel.effects.push(key);
    }
    render();
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab],[data-view],[data-cat],[data-act],.card');
    if (!t) return;
    if (t.dataset.view) {
      S.view = t.dataset.view;
      [].forEach.call($('tabs').children, function (b) { b.classList.toggle('act', b.dataset.view === S.view); });
      Timeline.setView(S.view);
      return;
    }
    if (t.dataset.cat) { S.cattab = t.dataset.cat; render(); return; }
    if (t.dataset.tab) { S.tab = t.dataset.tab; render(); return; }
    if (t.dataset.act === 'edit') { S.edit = !S.edit; render(); return; }
    var sec = t.dataset.sec, key = t.dataset.key, it = find(sec, key);
    if (!sec) return;
    if (S.edit && sec !== 'formatos') { if (!it.none) toggleFiltro(sec, key); } else pick(sec, key);
  });
  document.addEventListener('mouseover', function (e) {
    var c = e.target.closest('.card'), v = c && c.querySelector('video');
    if (v && v.paused) v.play().catch(noop);
  });
  document.addEventListener('mouseout', function (e) {
    var c = e.target.closest('.card');
    if (c && !c.contains(e.relatedTarget)) { var v = c.querySelector('video'); if (v) v.pause(); }
  });
  $('editBtn').onclick = function () { S.edit = !S.edit; render(); };
  $('undoBtn').onclick = function () { Timeline.undo(); };
  $('redoBtn').onclick = function () { Timeline.redoAct(); };
  $('sideBtn').onclick = function () { Timeline.toggleSide('left'); };
  $('insBtn').onclick = function () { $('insBtn').classList.toggle('off', !Timeline.toggleSide('right')); };
  // el vídeo tal como saldrá, en el propio navegador (herramientas/resultado.js)
  $('shotBtn').onclick = function () { if (window.MiResultado) MiResultado.toggle(); };
  Timeline.onResultado = function (on) { $('shotBtn').classList.toggle('on', on); };
  function startEditing() {
    var body = { formato: S.formato, correccion: S.correccion || '', picks: S.sel.captionStyle
      ? { mode: S.sel.mode, style: S.sel.style, captionStyle: S.sel.captionStyle, effects: S.sel.effects, effectSections: null } : null };
    $('saveBtn').disabled = true;
    api('/api/preparar', body).then(function () {
      toast('Listo. Claude empieza a cortar; ya puedes cerrar esta pestaña.');
      $('saveBtn').textContent = 'Enviado ✓';
    }).catch(function (e) { toast('No se pudo enviar: ' + e.message, true); $('saveBtn').disabled = false; });
  }

  $('saveBtn').onclick = function () {
    if (S.prep) {
      if (S.tab === 'effects' || S.tab === 'ficha') return startEditing();
      S.tab = PREPORDER[PREPORDER.indexOf(S.tab) + 1] || 'effects'; S.edit = false; render(); $('page').scrollTo(0, 0);
      return;
    }
    if (S.project) return processVideo();
    var body = { mode: S.sel.mode, style: S.sel.style, captionStyle: S.sel.captionStyle, effects: S.sel.effects, effectSections: null };
    $('saveBtn').disabled = true;
    api('/api/formato', { formato: S.formato }).then(function () { return api('/api/save', body); })
      .then(function () { toast('Guardado. Ya puedes volver a Claude.'); })
      .catch(function (e) { toast('No se pudo guardar: ' + e.message, true); })
      .then(summary);
  };

  var me = Math.random().toString(36).slice(2, 12);
  var ping = function () { fetch('/api/ping?p=' + me, { cache: 'no-store' }).catch(noop); };
  ping(); setInterval(ping, 10000);
  window.addEventListener('pageshow', function (e) { if (e.persisted) ping(); });
  window.addEventListener('pagehide', function () {
    try { fetch('/api/bye', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ p: me }) }).catch(noop); } catch (e) {}
  });

  function loadTools(ids) {                                // uno detrás de otro: capas y audio van primero
    return ids.reduce(function (p, id) {
      return p.then(function () {
        return new Promise(function (ok) {
          var s = document.createElement('script');
          s.src = '/mi/herramientas/' + id + '.js';
          s.onload = ok; s.onerror = function () { toast('No se pudo cargar el módulo ' + id, true); ok(); };
          document.head.appendChild(s);
        });
      });
    }, Promise.resolve());
  }

  Promise.all([api('/api/catalog'), api('/api/picks'), api('/api/filtro'), api('/api/mode'), api('/api/formatos'), api('/api/formato')]).then(function (r) {
    S.modo = r[3]; S.cat = r[0]; S.filtro = r[2]; S.cat.formatos = r[4]; S.formato = r[5].formato;
    var p = r[1];
    S.sel = { mode: p.mode, style: p.style, captionStyle: p.captionStyle, effects: (p.effects || []).slice() };
    S.picks0 = JSON.stringify(picksNow()); S.formato0 = S.formato;
    var empty = !S.filtro.styles.length && !S.filtro.captions.length && !S.filtro.effects.length;
    if (empty) { S.edit = true; S.tab = 'captions'; }
    else if (!S.filtro.styles.length) S.tab = S.filtro.captions.length ? 'captions' : 'effects';
    if (!empty && S.cat.formatos.length) S.tab = 'formatos';
    if (r[3].preparar) { S.prep = true; S.edit = false; S.tab = 'formatos'; }
    $('pname').textContent = r[3].preparar ? 'Antes de cortar' : 'Catálogo';
    if (r[3].preparar && r[3].ficha) {
      PREPTABS.unshift(['ficha', 'Referencia']); PREPORDER.unshift('ficha');
      return api('/api/ficha').then(function (F) { S.ficha = F; S.tab = 'ficha'; render(); });
    }
    if (!r[3].project) return render();
    return Promise.all([api('/api/project'), api('/api/edicion'), api('/api/herramientas')]).then(function (r) {
      S.project = r[0]; S.edicion = r[1];
      return loadTools(r[2]).then(mountTimeline);
    });
  }).catch(function (e) { toast('No se pudo cargar el catálogo: ' + e.message, true); });
})();
</script>
</body>
</html>
